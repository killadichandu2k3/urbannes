apiVersion: v1
kind: Pod
metadata:
  name: git-server
  namespace: argocd
  labels:
    app: git-server
spec:
  nodeSelector:
    kubernetes.io/hostname: urbannes-control-plane
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
  - name: git-server
    image: alpine/git:2.45.2

    command: ["/bin/sh", "-c"]
    args:
      - |
        set -e
        REPO=/srv/git/urbannes.git
        if [ ! -d "$REPO" ]; then
          echo "==> First run: initializing bare repo"
          mkdir -p "$REPO"
          git init --bare "$REPO"
        fi

        echo "==> Seeding bare repo from mounted k8s/ source"
        git clone "$REPO" /tmp/work --quiet
        rm -rf /tmp/work/k8s
        cp -r /source/k8s /tmp/work/k8s
        cd /tmp/work
        git config user.email "git-server@urbannes.local"
        git config user.name "UrbanNes Git Server"
        git checkout -B main --quiet
        git add -A

        git commit -m "Sync from k8s/ manifests" --quiet --allow-empty
        git push origin HEAD:refs/heads/main --quiet --force
        cd /
        rm -rf /tmp/work

        git --git-dir="$REPO" symbolic-ref HEAD refs/heads/main
        which git-daemon >/dev/null 2>&1 || apk add --no-cache git-daemon --quiet
        echo "==> Starting git daemon on :9418 (read-only, no auth — cluster-internal only)"
        exec git daemon --base-path=/srv/git --export-all --reuseaddr \
          --listen=0.0.0.0 --port=9418 --verbose
    ports:
    - containerPort: 9418
      name: git
    volumeMounts:
    - name: source
      mountPath: /source
      readOnly: true
    - name: repo-data
      mountPath: /srv/git
    resources:
      requests: {cpu: "20m", memory: "32Mi"}
      limits: {cpu: "100m", memory: "128Mi"}
    readinessProbe:
      tcpSocket: {port: 9418}
      initialDelaySeconds: 5
      periodSeconds: 5
    livenessProbe:
      tcpSocket: {port: 9418}
      initialDelaySeconds: 15
      periodSeconds: 20
  volumes:
  - name: source
    hostPath:

      path: /urbannes-repo
      type: Directory
  - name: repo-data

    emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: argocd
spec:
  selector:
    app: git-server
  ports:
  - port: 9418
    targetPort: 9418
    name: git
