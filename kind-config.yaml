kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: urbannes
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP

    extraMounts:
      - hostPath: .
        containerPath: /urbannes-repo
        readOnly: true
  - role: worker
  - role: worker
