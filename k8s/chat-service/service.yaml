# ClusterIP Service fronting 2 replicas. Cross-pod chat delivery still
# works because both replicas subscribe to the same Redis Pub/Sub channel
# (see services/chat-service/src/redis/fanOutBridge.ts) — which replica a
# given WebSocket client lands on, decided by kube-proxy's load balancing
# across this Service's endpoints, doesn't matter for message delivery.
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: urbannest
spec:
  selector:
    app: chat-service
  ports:
  - port: 4200
    targetPort: 4200
