apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: urbannes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:

      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: notification-service
      containers:
      - name: notification-service
        image: urbannes/notification-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4100
        envFrom:
        - configMapRef: {name: urbannes-config}
        env:
        - name: PORT
          value: "4100"
        - name: PGUSER
          valueFrom: {secretKeyRef: {name: urbannes-secrets, key: PGUSER}}
        - name: PGPASSWORD
          valueFrom: {secretKeyRef: {name: urbannes-secrets, key: PGPASSWORD}}
        - name: RESEND_API_KEY
          valueFrom: {secretKeyRef: {name: urbannes-secrets, key: RESEND_API_KEY, optional: true}}
        readinessProbe:
          httpGet: {path: /health, port: 4100}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /health, port: 4100}
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests: {cpu: "100m", memory: "128Mi"}
          limits: {cpu: "400m", memory: "256Mi"}
