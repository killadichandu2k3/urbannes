apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: urbannes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
    spec:

      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: auth-api
      containers:
      - name: auth-api
        image: urbannes/auth-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4600
        envFrom:
        - configMapRef: {name: urbannes-config}
        env:
        - name: PORT
          value: "4600"
        - name: PGUSER
          valueFrom: {secretKeyRef: {name: urbannes-secrets, key: PGUSER}}
        - name: PGPASSWORD
          valueFrom: {secretKeyRef: {name: urbannes-secrets, key: PGPASSWORD}}
        - name: JWT_SECRET
          valueFrom: {secretKeyRef: {name: urbannes-secrets, key: JWT_SECRET}}
        - name: GOOGLE_CLIENT_ID
          valueFrom: {secretKeyRef: {name: urbannes-secrets, key: GOOGLE_CLIENT_ID, optional: true}}
        - name: RESEND_API_KEY
          valueFrom: {secretKeyRef: {name: urbannes-secrets, key: RESEND_API_KEY, optional: true}}
        readinessProbe:
          httpGet: {path: /health, port: 4600}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /health, port: 4600}
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests: {cpu: "100m", memory: "128Mi"}
          limits: {cpu: "500m", memory: "512Mi"}
