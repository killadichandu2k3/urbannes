apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx-config
  namespace: urbannes
data:
  nginx.conf: |
    worker_processes auto;
    events { worker_connections 1024; }
    http {
      include       mime.types;
      default_type  application/octet-stream;
      sendfile      on;
      keepalive_timeout 65;

      log_format gateway '$remote_addr - [$time_local] "$request" '
                          '$status $body_bytes_sent upstream=$upstream_addr rt=$request_time';
      access_log /dev/stdout gateway;
      error_log /dev/stderr warn;

      limit_req_zone $binary_remote_addr zone=general_zone:10m rate=20r/s;
      limit_req_status 429;

      upstream booking_api_upstream {
        server booking-api:4000;
        keepalive 32;
      }

      upstream graphql_gateway_upstream {
        server gateway-graphql:4500;
        keepalive 32;
      }

      server {
        listen 8080;

        location = /graphql {
          limit_req zone=general_zone burst=15 nodelay;
          proxy_pass http://graphql_gateway_upstream;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header Authorization $http_authorization;
        }
        location /graphql/ws {
          proxy_pass http://booking_api_upstream;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_set_header Host $host;
          proxy_read_timeout 3600s;
        }
        location /s/ {
          limit_req zone=general_zone burst=15 nodelay;
          proxy_pass http://booking_api_upstream;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
        }
        location /gateway/health {
          access_log off;
          return 200 '{"status":"ok"}';
          add_header Content-Type application/json;
        }
        location / {
          root /usr/share/nginx/html;
          try_files $uri $uri/ /index.html;
        }
      }
    }
