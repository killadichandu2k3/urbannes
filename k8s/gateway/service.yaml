# NodePort now — this Service IS the sole public entrypoint into the
# cluster (Kong has been removed; see the top-level README for why). NGINX
# itself now does everything Kong used to front: reverse-proxy routing,
# load balancing across replicas, and rate limiting (see configmap.yaml) —
# nothing sits in front of it anymore.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: urbannest
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30000
