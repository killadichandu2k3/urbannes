apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-api
  namespace: urbannes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-api
  template:
    metadata:
      labels:
        app: analytics-api
    spec:

      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: analytics-api
      containers:
      - name: analytics-api
        image: urbannes/analytics-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4300
        envFrom:
        - configMapRef: {name: urbannes-config}
        env:
        - name: PORT
          value: "4300"
        - name: PGUSER
          valueFrom: {secretKeyRef: {name: urbannes-secrets, key: PGUSER}}
        - name: PGPASSWORD
          valueFrom: {secretKeyRef: {name: urbannes-secrets, key: PGPASSWORD}}
        readinessProbe:
          httpGet: {path: /health, port: 4300}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /health, port: 4300}
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests: {cpu: "100m", memory: "128Mi"}
          limits: {cpu: "500m", memory: "512Mi"}
