# NOTE: base64 is encoding, not encryption — this is fine for a local
# Kind learning environment, but a real cluster would use a secret
# manager (Sealed Secrets, External Secrets Operator, Vault, or the
# cloud provider's own secret store) instead of committing this file.
# Values below are 'urbannes' / 'urbannes' base64-encoded, and
# JWT_SECRET is 'urbannes-dev-jwt-secret-change-me' base64-encoded —
# the exact same default every service falls back to in code (see
# services/shared/src/jwt.ts and services/auth-api/src/jwt.ts) if this
# env var is ever unset, so auth-api (which signs tokens) and
# booking-api (which verifies them) are guaranteed to agree even if this
# Secret is misconfigured or missing — they'd just both fall back
# together, not silently disagree.
#
# RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET / RESEND_API_KEY / GOOGLE_CLIENT_ID
# are deliberately NOT listed in `data` below — each is referenced with
# `optional: true` from the services that use it (see their deployment
# manifests), so a real deployment adds them here (or via `kubectl create
# secret` / a secret manager) without needing to touch this committed
# file, and their absence here just means those features run in whatever
# fallback/disabled mode their code already defines for an unset key.
apiVersion: v1
kind: Secret
metadata:
  name: urbannes-secrets
  namespace: urbannes
type: Opaque
data:
  PGUSER: dXJiYW5uZXM=
  PGPASSWORD: dXJiYW5uZXM=
  JWT_SECRET: dXJiYW5uZXMtZGV2LWp3dC1zZWNyZXQtY2hhbmdlLW1l
