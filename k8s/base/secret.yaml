# NOTE: base64 is encoding, not encryption — this is fine for a local
# Kind learning environment, but a real cluster would use a secret
# manager (Sealed Secrets, External Secrets Operator, Vault, or the
# cloud provider's own secret store) instead of committing this file.
# Values below are 'urbannest' / 'urbannest' base64-encoded, and
# JWT_SECRET is 'urbannest-dev-jwt-secret-change-me' base64-encoded —
# the exact same default every service falls back to in code (see
# services/shared/src/jwt.ts and services/auth-api/src/jwt.ts) if this
# env var is ever unset, so auth-api (which signs tokens) and
# booking-api (which verifies them) are guaranteed to agree even if this
# Secret is misconfigured or missing — they'd just both fall back
# together, not silently disagree.
apiVersion: v1
kind: Secret
metadata:
  name: urbannest-secrets
  namespace: urbannest
type: Opaque
data:
  PGUSER: dXJiYW5uZXN0
  PGPASSWORD: dXJiYW5uZXN0
  JWT_SECRET: dXJiYW5uZXN0LWRldi1qd3Qtc2VjcmV0LWNoYW5nZS1tZQ==
