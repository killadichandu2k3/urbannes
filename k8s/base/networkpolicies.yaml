# ============================================================================
# NetworkPolicies — default-deny-all, then explicit per-service allow rules.
# ----------------------------------------------------------------------------
# Without NetworkPolicies, every pod in the namespace can reach every
# other pod on any port — flat, trust-everything networking. That's fine
# for local dev-speed iteration, but the opposite of what "production-
# grade" means: a compromised or misbehaving pod (say, chat-service,
# which is the one service handling arbitrary user-supplied WebSocket
# messages) should NOT be able to open a connection straight to Postgres,
# which it has no legitimate reason to talk to.
#
# STRATEGY: one default-deny-ingress policy for the whole namespace
# (matches all pods, allows nothing by default), then one allow policy
# per resource describing exactly which pods may reach it and on which
# port — derived directly from the real dependency graph in this repo
# (docker-compose.yml's `depends_on`/environment blocks, and each
# service's actual outbound calls), not a guess.
#
# NOTE ON EGRESS: this only governs INGRESS (who may connect IN to each
# pod). Kubernetes NetworkPolicy can also restrict egress (who a pod may
# connect OUT to), which would be the natural next layer of defense —
# left out here to keep this addition scoped to what "production-grade
# k8s" was asked to cover; egress-restriction is a good next exercise,
# not a gap glossed over.
# ============================================================================

# ---- Default deny: applies to every pod in the namespace -------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: urbannes
spec:
  podSelector: {} # empty selector = matches ALL pods in this namespace
  policyTypes:
    - Ingress
  # No `ingress:` rules block at all = deny everything not explicitly
  # allowed by another NetworkPolicy below.
---
# ---- NGINX gateway: the only pod allowed ingress from OUTSIDE the
# namespace now that Kong has been removed — it IS the public edge
# (kube-proxy handles NodePort traffic hitting its Service before it ever
# becomes a "from pod X" question; this policy governs pod-to-pod traffic,
# and the NodePort exposure itself is a Service-level concern — see
# gateway/service.yaml — not a NetworkPolicy one). ------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-gateway
  namespace: urbannes
spec:
  podSelector:
    matchLabels: { app: gateway }
  policyTypes: [Ingress]
  ingress:
    - {} # allow from anywhere — this is the intended public edge

# ---- Apollo Gateway: only the NGINX gateway may reach it -------------------
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-graphql-gateway
  namespace: urbannes
spec:
  podSelector:
    matchLabels: { app: gateway-graphql }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: gateway } }
      ports:
        - port: 4500

# ---- booking-api: reached by the NGINX gateway directly for
# /graphql/ws subscriptions and /s/:code short links (both deliberately
# bypass GraphQL Federation — see gateway-graphql/src/server.ts), AND by
# gateway-graphql for regular queries/mutations (subgraph calls during
# federation) -----------------------------------------------------------
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-booking-api
  namespace: urbannes
spec:
  podSelector:
    matchLabels: { app: booking-api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: gateway } }
        - podSelector: { matchLabels: { app: gateway-graphql } }
      ports:
        - port: 4000

# ---- analytics-api: reached only by gateway-graphql (subgraph queries) ----
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-graphql-gateway-to-analytics-api
  namespace: urbannes
spec:
  podSelector:
    matchLabels: { app: analytics-api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: gateway-graphql } }
      ports:
        - port: 4300

# ---- auth-api: reached only by gateway-graphql (subgraph queries) — same
# shape as analytics-api above, since both talk to Postgres directly
# instead of going through booking-api's Kafka request/reply path. --------
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-graphql-gateway-to-auth-api
  namespace: urbannes
spec:
  podSelector:
    matchLabels: { app: auth-api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: gateway-graphql } }
      ports:
        - port: 4600

# ---- chat-service: reached only by the NGINX gateway (WS proxy) -----------
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-chat-service
  namespace: urbannes
spec:
  podSelector:
    matchLabels: { app: chat-service }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: gateway } }
      ports:
        - port: 4200

# ---- Postgres: reached by booking-worker (read/write OLTP path),
# analytics-api (direct read path), and auth-api (direct read/write to the
# users table — see services/auth-api/src/db/pool.ts) — nothing else has
# any legitimate reason to open a connection to it. Sharding has been
# removed, so this is one policy for one instance instead of two.
# ------------------------------------------------------------------------
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-workers-to-postgres
  namespace: urbannes
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: booking-worker } }
        - podSelector: { matchLabels: { app: analytics-api } }
        - podSelector: { matchLabels: { app: auth-api } }
      ports:
        - port: 5432

# ---- redis-cache (GET-side cache-aside): booking-worker, analytics-api,
# and auth-api all read/write it (see each service's cache module) — this
# used to be a 6-node Redis Cluster with its own gossip port; collapsed to
# a single instance, so no cluster-gossip rule is needed anymore. --------
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-workers-to-redis-cache
  namespace: urbannes
spec:
  podSelector:
    matchLabels: { app: redis-cache }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: booking-worker } }
        - podSelector: { matchLabels: { app: analytics-api } }
        - podSelector: { matchLabels: { app: auth-api } }
      ports:
        - port: 6379

# ---- redis-coord (seat locks + Pub/Sub): booking-worker publishes/locks,
# booking-api and chat-service subscribe for push updates -------------------
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-redis-coord
  namespace: urbannes
spec:
  podSelector:
    matchLabels: { app: redis-coord }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: booking-worker } }
        - podSelector: { matchLabels: { app: booking-api } }
        - podSelector: { matchLabels: { app: chat-service } }
      ports:
        - port: 6379

# ---- Kafka: booking-api (produces requests), booking-worker (consumes +
# produces domain events), notification-service (consumes domain events) --
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-kafka
  namespace: urbannes
spec:
  podSelector:
    matchLabels: { app: kafka }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: kafka } }
        - podSelector: { matchLabels: { app: booking-api } }
        - podSelector: { matchLabels: { app: booking-worker } }
        - podSelector: { matchLabels: { app: notification-service } }
      ports:
        - port: 9092
        - port: 29092

# ---- Zookeeper: only Kafka itself needs to reach it ------------------------
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-to-zookeeper
  namespace: urbannes
spec:
  podSelector:
    matchLabels: { app: zookeeper }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: kafka } }
      ports:
        - port: 2181
