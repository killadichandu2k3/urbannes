apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: urbannes
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-gateway
  namespace: urbannes
spec:
  podSelector:
    matchLabels: { app: gateway }
  policyTypes: [Ingress]
  ingress:
    - {}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-graphql-gateway
  namespace: urbannes
spec:
  podSelector:
    matchLabels: { app: gateway-graphql }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: gateway } }
      ports:
        - port: 4500

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-booking-api
  namespace: urbannes
spec:
  podSelector:
    matchLabels: { app: booking-api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: gateway } }
        - podSelector: { matchLabels: { app: gateway-graphql } }
      ports:
        - port: 4000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-graphql-gateway-to-analytics-api
  namespace: urbannes
spec:
  podSelector:
    matchLabels: { app: analytics-api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: gateway-graphql } }
      ports:
        - port: 4300

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-graphql-gateway-to-auth-api
  namespace: urbannes
spec:
  podSelector:
    matchLabels: { app: auth-api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: gateway-graphql } }
      ports:
        - port: 4600

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-workers-to-postgres
  namespace: urbannes
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: booking-worker } }
        - podSelector: { matchLabels: { app: analytics-api } }
        - podSelector: { matchLabels: { app: auth-api } }
        - podSelector: { matchLabels: { app: notification-service } }
      ports:
        - port: 5432

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-workers-to-redis-cache
  namespace: urbannes
spec:
  podSelector:
    matchLabels: { app: redis-cache }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: booking-worker } }
        - podSelector: { matchLabels: { app: analytics-api } }
        - podSelector: { matchLabels: { app: auth-api } }
      ports:
        - port: 6379

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-redis-coord
  namespace: urbannes
spec:
  podSelector:
    matchLabels: { app: redis-coord }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: booking-worker } }
        - podSelector: { matchLabels: { app: booking-api } }
      ports:
        - port: 6379

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-kafka
  namespace: urbannes
spec:
  podSelector:
    matchLabels: { app: kafka }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: kafka } }
        - podSelector: { matchLabels: { app: booking-api } }
        - podSelector: { matchLabels: { app: booking-worker } }
        - podSelector: { matchLabels: { app: notification-service } }
      ports:
        - port: 9092
        - port: 29092

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-to-zookeeper
  namespace: urbannes
spec:
  podSelector:
    matchLabels: { app: zookeeper }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: kafka } }
      ports:
        - port: 2181
