apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-api
  namespace: urbannes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking-api
  template:
    metadata:
      labels:
        app: booking-api
    spec:
      # Spreads this Deployment's replicas across DIFFERENT nodes rather
      # than letting the scheduler put both on whichever node happens to
      # have room. maxSkew: 1 means "no node may hold more than 1 pod more
      # than the least-loaded node" — with 2 replicas and 2 worker nodes
      # (see kind-config.yaml), that forces the two pods onto two distinct
      # nodes. whenUnsatisfiable: ScheduleAnyway (not DoNotSchedule) means
      # a genuinely resource-starved cluster still schedules the pod
      # somewhere rather than leaving it Pending forever — spread is a
      # preference here, not a hard requirement, matching how a real
      # cluster autoscaler-backed deployment would be configured.
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: booking-api
      containers:
      - name: booking-api
        image: urbannes/booking-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4000
        envFrom:
        - configMapRef: {name: urbannes-config}
        env:
        - name: PORT
          value: "4000"
        readinessProbe:
          httpGet: {path: /health, port: 4000}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /health, port: 4000}
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests: {cpu: "100m", memory: "128Mi"}
          limits: {cpu: "500m", memory: "512Mi"}
