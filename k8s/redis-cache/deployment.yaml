apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache
  namespace: urbannes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cache
  template:
    metadata:
      labels:
        app: redis-cache
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests: {cpu: "50m", memory: "64Mi"}
          limits: {cpu: "250m", memory: "256Mi"}
        readinessProbe:
          exec: {command: ["redis-cli", "ping"]}
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          exec: {command: ["redis-cli", "ping"]}
          initialDelaySeconds: 15
          periodSeconds: 15
          failureThreshold: 5
