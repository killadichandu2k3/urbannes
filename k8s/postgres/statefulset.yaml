apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: urbannes
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom: {secretKeyRef: {name: urbannes-secrets, key: PGUSER}}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: urbannes-secrets, key: PGPASSWORD}}
        - name: POSTGRES_DB
          value: urbannes
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec: {command: ["pg_isready", "-U", "urbannes"]}
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:

          exec: {command: ["pg_isready", "-U", "urbannes"]}
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 5
        resources:
          requests: {cpu: "200m", memory: "256Mi"}
          limits: {cpu: "1000m", memory: "1Gi"}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: urbannes-db-storage
      resources:
        requests:
          storage: 2Gi
