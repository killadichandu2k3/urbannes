name: CD (deploy to local Kind cluster)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to local Kind cluster
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, kind]
    environment: production-local
    defaults:
      run:
        shell: bash
    env:
      CLUSTER_NAME: urbannes
    steps:
      - uses: actions/checkout@v4

      - name: Verify Kind cluster is running
        run: |
          kind get clusters | grep -qx "${CLUSTER_NAME}" || \
            (echo "Kind cluster '${CLUSTER_NAME}' does not exist on this machine — create it first with: kind create cluster --config kind-config.yaml" && exit 1)

      - name: Point kubectl at the Kind cluster
        run: kubectl config use-context "kind-${CLUSTER_NAME}"

      - name: Rebuild images and load them into Kind
        run: ./scripts/build-images.sh

      - name: Deploy via ArgoCD (install if not present & trigger sync)
        run: |
          if ! kubectl get deployment argocd-server -n argocd >/dev/null 2>&1; then
            echo "ArgoCD not found — running setup-argocd.sh"
            ./scripts/setup-argocd.sh
          else
            echo "ArgoCD active — refreshing in-cluster git repository & triggering sync"
            kubectl delete pod git-server -n argocd --ignore-not-found
            kubectl apply -f k8s-argocd/git-server.yaml
            kubectl patch application urbannes -n argocd --type merge \
              -p '{"operation":{"sync":{"revision":"HEAD"}}}' >/dev/null 2>&1 || true
          fi

      - name: Wait for backing services (Postgres, Redis, Kafka)
        run: |
          kubectl wait --for=condition=ready pod -l app=postgres -n urbannes --timeout=180s
          kubectl wait --for=condition=ready pod -l app=redis-cache -n urbannes --timeout=180s
          kubectl wait --for=condition=available deployment/kafka -n urbannes --timeout=180s

      - name: Force rollout of updated images
        run: |

          kubectl rollout restart deployment/auth-api -n urbannes
          kubectl rollout restart deployment/booking-api -n urbannes
          kubectl rollout restart deployment/booking-worker -n urbannes
          kubectl rollout restart deployment/analytics-api -n urbannes
          kubectl rollout restart deployment/gateway-graphql -n urbannes
          kubectl rollout restart deployment/notification-service -n urbannes
          kubectl rollout restart deployment/gateway -n urbannes

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/auth-api -n urbannes --timeout=180s
          kubectl rollout status deployment/booking-api -n urbannes --timeout=180s
          kubectl rollout status deployment/booking-worker -n urbannes --timeout=180s
          kubectl rollout status deployment/analytics-api -n urbannes --timeout=180s
          kubectl rollout status deployment/gateway-graphql -n urbannes --timeout=180s
          kubectl rollout status deployment/notification-service -n urbannes --timeout=180s
          kubectl rollout status deployment/gateway -n urbannes --timeout=180s

      - name: Confirm pods are actually spread across nodes
        run: |

          kubectl get pods -n urbannes -o wide

      - name: Post-deploy smoke test
        run: |

          URL="http://localhost:30000"
          curl -sf "$URL/graphql" -X POST \
            -H "content-type: application/json" \
            -d "{\"query\":\"{ events { id } }\"}" | grep -q '"events"'

      - name: Report deployed image tags
        run: kubectl get deployments -n urbannes -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.template.spec.containers[0].image}{"\n"}{end}'
