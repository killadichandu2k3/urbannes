name: CD (deploy to local Kind cluster)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to local Kind cluster
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, kind]
    environment: production-local
    defaults:
      run:
        shell: bash
    env:
      CLUSTER_NAME: urbannest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Kind cluster is running
        run: |
          kind get clusters | grep -qx "${CLUSTER_NAME}" || \
            (echo "Kind cluster '${CLUSTER_NAME}' does not exist on this machine — create it first with: kind create cluster --config kind-config.yaml" && exit 1)

      - name: Point kubectl at the Kind cluster
        run: kubectl config use-context "kind-${CLUSTER_NAME}"

      - name: Rebuild images and load them into Kind
        run: ./scripts/build-images.sh

      - name: Apply k8s manifests
        run: kubectl apply -k k8s/

      - name: Force rollout of updated images
        run: |
          # WHY THIS STEP EXISTS: every Deployment here uses `image:
          # ...:latest` with `imagePullPolicy: IfNotPresent`. Kind nodes
          # have their own isolated containerd image store (no registry
          # involved), and `kind load docker-image` above already loaded
          # the freshly-built image into it — but the Deployment spec's
          # image STRING never changes (it's always ":latest"), so
          # `kubectl apply -k` alone sees no diff and won't schedule new
          # pods. Kubernetes only rolls out on a spec change; a same-tag
          # image swap isn't one. `kubectl rollout restart` forces new
          # pods regardless, which then pick up the freshly-loaded image
          # per IfNotPresent (present now, so used) — this is the
          # standard fix for exactly this local-cluster + :latest-tag
          # combination, not a workaround specific to this repo.
          kubectl rollout restart deployment/auth-api -n urbannest
          kubectl rollout restart deployment/booking-api -n urbannest
          kubectl rollout restart deployment/booking-worker -n urbannest
          kubectl rollout restart deployment/analytics-api -n urbannest
          kubectl rollout restart deployment/gateway-graphql -n urbannest
          kubectl rollout restart deployment/notification-service -n urbannest
          kubectl rollout restart deployment/chat-service -n urbannest
          kubectl rollout restart deployment/gateway -n urbannest

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/auth-api -n urbannest --timeout=180s
          kubectl rollout status deployment/booking-api -n urbannest --timeout=180s
          kubectl rollout status deployment/booking-worker -n urbannest --timeout=180s
          kubectl rollout status deployment/analytics-api -n urbannest --timeout=180s
          kubectl rollout status deployment/gateway-graphql -n urbannest --timeout=180s
          kubectl rollout status deployment/notification-service -n urbannest --timeout=180s
          kubectl rollout status deployment/chat-service -n urbannest --timeout=180s
          kubectl rollout status deployment/gateway -n urbannest --timeout=180s

      - name: Confirm pods are actually spread across nodes
        run: |
          # topologySpreadConstraints (see k8s/booking-api/deployment.yaml)
          # only EXPRESSES the intent that replicas land on different
          # nodes — this step confirms the scheduler actually honored it
          # on this real 3-worker-node Kind cluster (see kind-config.yaml),
          # rather than trusting the manifest and hoping.
          kubectl get pods -n urbannest -o wide

      - name: Post-deploy smoke test
        run: |
          # NGINX's own NodePort (:30000) is the public entrypoint now
          # that Kong has been removed — see kind-config.yaml and
          # k8s/gateway/service.yaml. No API key or auth header needed for
          # this public query.
          URL="http://localhost:30000"
          curl -sf "$URL/graphql" -X POST \
            -H 'content-type: application/json' \
            -d '{"query":"{ events { id } }"}' | grep -q '"events"'

      - name: Report deployed image tags
        run: kubectl get deployments -n urbannest -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.template.spec.containers[0].image}{"\n"}{end}'
