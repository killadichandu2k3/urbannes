name: urbannes
services:
  zookeeper:
    container_name: zookeeper
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | timeout 1 nc -w 1 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    container_name: kafka
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: urbannes
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  postgres:
    container_name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: urbannes
      POSTGRES_PASSWORD: urbannes
      POSTGRES_DB: urbannes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbannes"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-cache:
    container_name: redis-cache
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-coord:
    container_name: redis-coord
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-api:
    container_name: auth-api
    build:
      context: .
      dockerfile: services/auth-api/Dockerfile
    depends_on:
      - postgres
      - redis-cache
    environment:
      PORT: 4600
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: urbannes
      PGPASSWORD: urbannes
      PGDATABASE: urbannes
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: 6379
      JWT_SECRET: urbannes-dev-jwt-secret-change-me
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFICATIONS_FROM_EMAIL: ${NOTIFICATIONS_FROM_EMAIL:-UrbanNes <onboarding@resend.dev>}
    expose:
      - "4600"

  booking-api:
    container_name: booking-api
    build:
      context: .
      dockerfile: services/booking-api/Dockerfile
    depends_on:
      - kafka
      - redis-coord
    environment:
      PORT: 4000
      KAFKA_BROKERS: kafka:29092
      REDIS_HOST: redis-coord
      REDIS_PORT: 6379
      REPLY_TIMEOUT_MS: 5000
      PUBLIC_SHORT_URL_BASE: http://localhost:8080/s
      JWT_SECRET: urbannes-dev-jwt-secret-change-me
    expose:
      - "4000"

  booking-worker:
    container_name: booking-worker
    build:
      context: .
      dockerfile: services/booking-worker/Dockerfile
    depends_on:
      - kafka
      - postgres
      - redis-coord
      - redis-cache
    environment:
      KAFKA_BROKERS: kafka:29092
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: urbannes
      PGPASSWORD: urbannes
      PGDATABASE: urbannes
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: 6379
      REDIS_LOCK_HOST: redis-coord
      REDIS_LOCK_PORT: 6379
      SEAT_LOCK_TTL_MS: 300000
      PUBLIC_SHORT_URL_BASE: http://localhost:8080/s
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}

  notification-service:
    container_name: notification-service
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    depends_on:
      - kafka
      - postgres
    environment:
      PORT: 4100
      KAFKA_BROKERS: kafka:29092
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: urbannes
      PGPASSWORD: urbannes
      PGDATABASE: urbannes
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFICATIONS_FROM_EMAIL: ${NOTIFICATIONS_FROM_EMAIL:-UrbanNes <onboarding@resend.dev>}
    ports:
      - "4100:4100"

  analytics-api:
    container_name: analytics-api
    build:
      context: .
      dockerfile: services/analytics-api/Dockerfile
    depends_on:
      - postgres
      - redis-cache
    environment:
      PORT: 4300
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: urbannes
      PGPASSWORD: urbannes
      PGDATABASE: urbannes
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: 6379
    expose:
      - "4300"

  gateway-graphql:
    container_name: gateway-graphql
    build:
      context: .
      dockerfile: services/gateway-graphql/Dockerfile
    restart: on-failure
    depends_on:
      - auth-api
      - booking-api
      - analytics-api
    environment:
      PORT: 4500
      AUTH_API_GRAPHQL_URL: http://auth-api:4600/graphql
      BOOKING_API_GRAPHQL_URL: http://booking-api:4000/graphql
      ANALYTICS_API_GRAPHQL_URL: http://analytics-api:4300/graphql
    expose:
      - "4500"

  gateway:
    container_name: gateway
    build:
      context: .
      dockerfile: gateway/Dockerfile
    depends_on:
      - auth-api
      - booking-api
      - gateway-graphql
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_cache_data:
