# =============================================================================
# UrbanNes API Gateway — NGINX as reverse proxy + load balancer + rate
# limiter, all real NGINX directives (not a diagram of what a gateway
# "would" do).
# -----------------------------------------------------------------------------
# LOAD BALANCING: each `upstream` block lists multiple container/pod
# addresses. NGINX's default load-balancing algorithm is round-robin across
# them. When you `docker compose up --scale booking-api=3`, requests get
# spread across all 3 automatically because Docker's embedded DNS returns
# all matching container IPs for the service name and NGINX resolves them
# at startup — see docker-compose.yml comments for the scaling command. In
# Kubernetes, the upstream instead points at the ClusterIP Service, and
# kube-proxy does the load balancing across pod endpoints one layer down —
# both are shown in this repo (k8s/gateway/).
#
# RATE LIMITING: limit_req_zone defines a shared-memory zone keyed by client
# IP, budgeted in requests/second with a burst allowance. This is a real
# token-bucket limiter enforced by NGINX itself, returning true 429s — try
# hammering /graphql with `ab` or a quick shell loop and watch it kick in.
#
# REVERSE PROXY: every location block forwards to an internal upstream the
# browser never talks to directly — the browser only ever sees this one
# origin (:8080), which is also what makes CORS a non-issue for the SPA.
# =============================================================================

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  log_format gateway '$remote_addr - [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      'upstream=$upstream_addr rt=$request_time';
  access_log /dev/stdout gateway;
  error_log /dev/stderr warn;

  # ---- Rate limiting zones -------------------------------------------------
  # 10MB zone ~= enough state for ~160k tracked IPs. Two tiers: a generous
  # one for normal browsing (events, seat map reads) and a stricter one for
  # the write-heavy booking mutation path, since that's the endpoint most
  # worth protecting from abuse/retries-gone-wild.
  limit_req_zone $binary_remote_addr zone=general_zone:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=booking_zone:10m rate=5r/s;
  limit_req_status 429;

  # ---- Upstreams (reverse-proxy targets) -----------------------------------
  # Multiple `server` lines per upstream = real load balancing. In Docker
  # Compose, scale the service and add more `server` lines (or use the
  # scale-aware compose profile described in the README) — in Kubernetes,
  # this whole upstream collapses to one Service DNS name because kube-proxy
  # already load-balances across pod endpoints for us.
  upstream booking_api_upstream {
    server booking-api:4000 max_fails=3 fail_timeout=10s;
    # server booking-api-2:4000 max_fails=3 fail_timeout=10s; # add on scale-out
    keepalive 32;
  }

  # Apollo Gateway — composes booking-api + analytics-api into one schema.
  # All GraphQL HTTP (queries/mutations) goes here now, NOT to booking-api
  # directly, so a client can ask for booking + analytics fields on the
  # same entity in one request. Subscriptions (below) still bypass this
  # and go straight to booking-api, since Apollo Gateway here doesn't
  # proxy the WS subscription transport — see gateway-graphql/src/server.ts
  # for why that split is intentional, not an oversight.
  upstream graphql_gateway_upstream {
    server gateway-graphql:4500 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  upstream chat_service_upstream {
    server chat-service:4200 max_fails=3 fail_timeout=10s;
    keepalive 16;
  }

  server {
    listen 8080;
    server_name _;

    # ---- GraphQL HTTP (queries + mutations) --------------------------------
    # Routed to the Apollo Gateway (composed booking + analytics schema),
    # NOT directly to booking-api anymore. Exact-match on /graphql so it
    # doesn't also swallow /graphql/ws below (NGINX prefix-matches location
    # blocks, and a bare `/graphql` prefix WOULD match `/graphql/ws` too —
    # the `=` here forces exact-match so the two blocks stay independent).
    location = /graphql {
      limit_req zone=general_zone burst=15 nodelay;

      proxy_pass http://graphql_gateway_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- GraphQL WebSocket (subscriptions) ---------------------------------
    # Deliberately still points at booking-api directly, not the Gateway —
    # subscriptions are the one thing that bypasses schema federation here.
    # See gateway-graphql/src/server.ts for the full explanation.
    location /graphql/ws {
      proxy_pass http://booking_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s; # keep long-lived WS connections open
    }

    # ---- Chat WebSocket -----------------------------------------------------
    location /chat {
      proxy_pass http://chat_service_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    # ---- Short link redirects -----------------------------------------------
    # Handled by booking-api's REST-ish passthrough for the /s/:code redirect
    # (kept on the same upstream as GraphQL since it's a small addition to
    # booking-api rather than a whole separate service).
    location /s/ {
      limit_req zone=general_zone burst=15 nodelay;
      proxy_pass http://booking_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Gateway health -------------------------------------------------------
    location /gateway/health {
      access_log off;
      return 200 '{"status":"ok","service":"gateway"}';
      add_header Content-Type application/json;
    }

    # ---- Static frontend build (production mode) -----------------------------
    # In local dev the Vite dev server runs on :5173 and proxies /graphql,
    # /chat, /s itself (see frontend/vite.config.ts) — this block only
    # matters when the frontend has been built and copied into the gateway
    # image for a "docker compose up" that mirrors production more closely.
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}
