worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

  log_format gateway '$remote_addr - [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      'upstream=$upstream_addr rt=$request_time';
  access_log /dev/stdout gateway;
  error_log /dev/stderr warn;

  limit_req_zone $binary_remote_addr zone=general_zone:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=booking_zone:10m rate=5r/s;
  limit_req_status 429;

  upstream booking_api_upstream {
    server booking-api:4000 max_fails=3 fail_timeout=10s;

    keepalive 32;
  }

  upstream graphql_gateway_upstream {
    server gateway-graphql:4500 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  server {
    listen 8080;
    server_name _;

    location = /graphql {
      limit_req zone=general_zone burst=15 nodelay;

      proxy_pass http://graphql_gateway_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /graphql/ws {
      proxy_pass http://booking_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    location /s/ {
      limit_req zone=general_zone burst=15 nodelay;
      proxy_pass http://booking_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /gateway/health {
      access_log off;
      return 200 '{"status":"ok","service":"gateway"}';
      add_header Content-Type application/json;
    }

    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff)$ {
      root /usr/share/nginx/html;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
      root /usr/share/nginx/html;
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
      try_files $uri =404;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}
