extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key"])

type Venue @key(fields: "id") {
  id: ID!
  name: String!
  venueType: String!
  totalSeats: Int!
  city: String!
}

type EventType @key(fields: "id") {
  id: ID!
  title: String!
  venueId: ID!
  startsAt: String!
  endsAt: String!
  basePrice: Float!
  bookingOpen: Boolean!
}

type Seat {
  id: ID!
  rowLabel: String!
  seatNumber: Int!
  tier: String!
  status: String!
}

type SeatMap {
  eventId: ID!
  venueId: ID!
  seats: [Seat!]!
  servedFromCache: Boolean!
}

type AddOnInput_ {
  code: String!
}

type Booking {
  id: ID!
  userId: ID!
  eventId: ID!
  status: String!
  basePrice: Float!
  finalPrice: Float!
  seatIds: [ID!]!
  addOnCodes: [String!]!
  createdAt: String!
  updatedAt: String!
}

type BookingAccepted {
  requestId: ID!
  status: String!
  message: String!
  bookingId: ID
}

type PaymentOrder {
  orderId: String!
  amount: Int!
  currency: String!
  keyId: String!
}

type ShortLink {
  code: String!
  targetUrl: String!
  shortUrl: String!
}

type Query {
  venues: [Venue!]!
  events: [EventType!]!
  event(id: ID!): EventType
  seatMap(eventId: ID!): SeatMap!
  booking(id: ID!, eventId: ID!): Booking

  myBookings: [Booking!]!
}

input SeatSelectionInput {
  seatId: String!
}

input CreateBookingInput {
  eventId: String!
  seatIds: [String!]!
  addOnCodes: [String!]
  discountCode: String
  pricingStrategy: String
}

type Mutation {
  createBooking(input: CreateBookingInput!): BookingAccepted!
  createPaymentOrder(bookingId: String!, eventId: String!): PaymentOrder!
  confirmPayment(
    bookingId: String!
    eventId: String!
    razorpayOrderId: String!
    razorpayPaymentId: String!
    razorpaySignature: String!
  ): BookingAccepted!
  cancelBooking(bookingId: String!, eventId: String!): BookingAccepted!
  createShortLink(targetUrl: String!): ShortLink!
}

type BookingUpdate {
  bookingId: ID!
  eventId: ID!
  status: String!
  message: String
}

type SeatMapUpdate {
  eventId: ID!
  seatId: ID!
  status: String!
}

type Subscription {
  bookingUpdated(bookingId: ID!): BookingUpdate!
  seatMapUpdated(eventId: ID!): SeatMapUpdate!
}
