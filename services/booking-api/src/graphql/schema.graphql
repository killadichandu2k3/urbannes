# ============================================================================
# UrbanNest booking-api GraphQL schema — Apollo Federation SUBGRAPH.
# ----------------------------------------------------------------------------
# Every Query and Mutation here is a REQUEST/REPLY over Kafka, not a direct
# DB call (see src/graphql/resolvers.ts and src/kafka/requestReply.ts).
# This API process never touches Postgres or Redis directly — booking-worker
# does, against a single Postgres instance and a single cache Redis (see
# booking-worker/src/db/pool.ts and cache/cache.ts; sharding has been
# removed from this project).
#
# Venue and EventType are declared with @key(fields: "id") — this makes them
# FEDERATED ENTITIES. It tells the Apollo Gateway "this subgraph owns the
# canonical version of these types, keyed by id," which is what lets
# analytics-api separately `extend` them with a `stats` field. Without
# @key, no other subgraph could contribute fields to these types.
# ============================================================================

extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key"])

type Venue @key(fields: "id") {
  id: ID!
  name: String!
  venueType: String!
  totalSeats: Int!
  city: String!
}

type EventType @key(fields: "id") {
  id: ID!
  title: String!
  venueId: ID!
  startsAt: String!
  endsAt: String!
  basePrice: Float!
  bookingOpen: Boolean!
}

type Seat {
  id: ID!
  rowLabel: String!
  seatNumber: Int!
  tier: String!
  status: String! # AVAILABLE | LOCKED | BOOKED
}

type SeatMap {
  eventId: ID!
  venueId: ID!
  seats: [Seat!]!
  servedFromCache: Boolean!
}

type AddOnInput_ {
  code: String!
}

type Booking {
  id: ID!
  userId: ID!
  eventId: ID!
  status: String!
  basePrice: Float!
  finalPrice: Float!
  seatIds: [ID!]!
  addOnCodes: [String!]!
  createdAt: String!
  updatedAt: String!
}

type BookingAccepted {
  requestId: ID!
  status: String! # ACCEPTED
  message: String!
}

type ShortLink {
  code: String!
  targetUrl: String!
  shortUrl: String!
}

type Query {
  venues: [Venue!]!
  events: [EventType!]!
  event(id: ID!): EventType
  seatMap(eventId: ID!): SeatMap!
  booking(id: ID!, eventId: ID!): Booking
  # No userId argument — "my" bookings means the CALLER's bookings, resolved
  # from their JWT (see resolvers.ts requireAuth()), not whichever userId a
  # client happens to send. Before real auth existed, this had to take
  # userId as an argument since there was no other way to know who "my"
  # meant; now that a token exists, trusting a client-supplied id here
  # would let anyone read anyone else's bookings just by guessing a UUID.
  myBookings: [Booking!]!
}

input SeatSelectionInput {
  seatId: String!
}

input CreateBookingInput {
  eventId: String!
  seatIds: [String!]!
  addOnCodes: [String!]
  discountCode: String
  pricingStrategy: String # "flat" | "surge" | "early-bird" — omit for auto-pick
}

type Mutation {
  createBooking(input: CreateBookingInput!): BookingAccepted!
  confirmPayment(bookingId: String!, eventId: String!): BookingAccepted!
  cancelBooking(bookingId: String!, eventId: String!): BookingAccepted!
  createShortLink(targetUrl: String!): ShortLink!
}

type BookingUpdate {
  bookingId: ID!
  eventId: ID!
  status: String!
  message: String
}

type SeatMapUpdate {
  eventId: ID!
  seatId: ID!
  status: String!
}

type Subscription {
  bookingUpdated(bookingId: ID!): BookingUpdate!
  seatMapUpdated(eventId: ID!): SeatMapUpdate!
}
