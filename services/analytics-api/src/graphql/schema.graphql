extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key", "@extends", "@external", "@shareable"])

type VenueStats {
  venueId: ID!
  totalBookings: Int!
  confirmedBookings: Int!
  cancelledBookings: Int!
  totalRevenue: Float!
  occupancyRate: Float!
}

type EventStats {
  eventId: ID!
  totalBookings: Int!
  confirmedBookings: Int!
  totalRevenue: Float!
  seatsSold: Int!
  seatsRemaining: Int!
}

type RevenueByMonth {
  month: String!
  totalRevenue: Float!
  bookingCount: Int!
}

type PlatformStats {
  totalVenues: Int!
  totalEvents: Int!
  totalBookings: Int!
  totalRevenue: Float!
  revenueByMonth: [RevenueByMonth!]!
}

type Venue @key(fields: "id") @extends {
  id: ID! @external
  stats: VenueStats!
}

type EventType @key(fields: "id") @extends {
  id: ID! @external
  stats: EventStats!
}

type SearchResult {
  kind: String!
  id: ID!
  title: String!
  subtitle: String!
}

type Query {
  venueStats(venueId: ID!): VenueStats!
  eventStats(eventId: ID!): EventStats!
  platformStats: PlatformStats!

  search(query: String!, limit: Int): [SearchResult!]!
}
