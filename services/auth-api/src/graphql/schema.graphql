type User {
  id: ID!
  email: String!
  displayName: String!

  hasPassword: Boolean!
}

type AuthPayload {
  token: String!
  user: User!
}

type RegistrationStarted {
  email: String!
  message: String!
}

input RegisterInput {
  email: String!
  password: String!
  displayName: String!
}

input LoginInput {
  email: String!
  password: String!
}

input UpdateProfileInput {
  displayName: String!
}

input ChangePasswordInput {
  currentPassword: String!
  newPassword: String!
}

type Notification {
  id: ID!
  title: String!
  body: String!
  readAt: String
  createdAt: String!
}

type Query {

  me: User

  myNotifications: [Notification!]!
}

type Mutation {

  register(input: RegisterInput!): RegistrationStarted!
  verifyEmail(email: String!, code: String!): AuthPayload!
  resendVerificationCode(email: String!): RegistrationStarted!
  login(input: LoginInput!): AuthPayload!

  loginWithGoogle(idToken: String!): AuthPayload!

  updateProfile(input: UpdateProfileInput!): User!

  changePassword(input: ChangePasswordInput!): Boolean!
  markNotificationRead(id: ID!): Boolean!
  markAllNotificationsRead: Boolean!
  deleteNotification(id: ID!): Boolean!
}
