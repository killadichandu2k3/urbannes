# ============================================================================
# UrbanNest auth-api GraphQL schema — Apollo Federation SUBGRAPH.
# ----------------------------------------------------------------------------
# Composed into the same supergraph as booking-api/analytics-api by
# gateway-graphql (see services/gateway-graphql/src/server.ts — just add
# this subgraph's URL to its `subgraphs` list). The frontend keeps talking
# to the ONE Apollo Gateway endpoint; register/login are just more
# mutations on that same schema, not a separate API to wire up.
# ============================================================================

type User {
  id: ID!
  email: String!
  displayName: String!
}

type AuthPayload {
  token: String!
  user: User!
}

# Returned by `register` — no token yet, since the account isn't usable
# until the emailed code is verified (see verifyEmail below).
type RegistrationStarted {
  email: String!
  message: String!
}

input RegisterInput {
  email: String!
  password: String!
  displayName: String!
}

input LoginInput {
  email: String!
  password: String!
}

type Notification {
  id: ID!
  title: String!
  body: String!
  readAt: String
  createdAt: String!
}

type Query {
  # Resolves the caller's own identity from the Authorization header —
  # lets the Angular app restore a session on page reload without
  # re-sending the password (see AuthService.restoreSession()).
  me: User
  # Most-recent-first, capped server-side (see resolvers.ts) — the bell
  # dropdown is a recent-activity list, not a full paginated inbox.
  myNotifications: [Notification!]!
}

type Mutation {
  # Validates input (password strength, duplicate email), creates the
  # account in an unverified state, and emails a 6-digit code — does NOT
  # return a token. Call verifyEmail with the code to actually sign in.
  register(input: RegisterInput!): RegistrationStarted!
  verifyEmail(email: String!, code: String!): AuthPayload!
  resendVerificationCode(email: String!): RegistrationStarted!
  login(input: LoginInput!): AuthPayload!
  markNotificationRead(id: ID!): Boolean!
  markAllNotificationsRead: Boolean!
}
