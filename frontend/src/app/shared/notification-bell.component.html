<div class="notif-bell-wrap" *ngIf="auth.isLoggedIn">
  <button class="secondary notif-bell-btn flex items-center justify-center p-2" (click)="toggle()" [attr.aria-expanded]="open">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" /></svg>
    <span class="notif-badge" *ngIf="unreadCount > 0">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
  </button>

  <div class="notif-dropdown" *ngIf="open">
    <div class="notif-dropdown-head">
      <span style="font-weight: 700;">Notifications</span>
      <a *ngIf="unreadCount > 0" (click)="markAllRead()" style="font-size: var(--fs-xs); cursor: pointer;">Mark all read</a>
    </div>

    <div class="empty-state" style="padding: var(--sp-5);" *ngIf="notifications.length === 0">
      <p class="muted" style="margin: 0;">No notifications yet.</p>
    </div>

    <div class="notif-list" *ngIf="notifications.length > 0">
      <div
        class="notif-item"
        *ngFor="let n of notifications"
        [class.unread]="!n.readAt"
        (click)="markRead(n)"
        style="position: relative; padding-right: var(--sp-6);"
      >
        <div class="notif-item-title">{{ n.title }}</div>
        <div class="notif-item-body muted">{{ n.body }}</div>
        <button 
          (click)="$event.stopPropagation(); deleteNotification(n.id)" 
          style="position: absolute; right: var(--sp-2); top: var(--sp-2); background: transparent; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 4px;"
          title="Delete notification"
        >
          &times;
        </button>
      </div>
    </div>
  </div>
</div>
