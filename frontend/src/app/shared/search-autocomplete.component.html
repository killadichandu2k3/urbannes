<div class="search-wrap">
  <div class="search-input-row">
    <span class="search-icon flex items-center justify-center">
      <svg *ngIf="!loading" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" /></svg>
      <svg *ngIf="loading" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 animate-spin opacity-70"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>
    </span>
    <input
      [(ngModel)]="query"
      (input)="onInput()"
      (keydown)="onKeydown($event)"
      (focus)="results.length && (open = true)"
      (blur)="onBlur()"
      placeholder="Search events or venues…"
      autocomplete="off"
    />
  </div>
  <div class="search-results" *ngIf="open">
    <div
      class="search-result-item"
      *ngFor="let r of results; let i = index"
      [class.active]="i === activeIndex"
      (mousedown)="pick(r)"
    >
      <div>
        <div [innerHTML]="highlight(r.title)"></div>
        <div class="faint">{{ r.subtitle }}</div>
      </div>
      <span class="kind">{{ r.kind }}</span>
    </div>
    <div class="search-empty" *ngIf="results.length === 0 && !loading">No matches</div>
  </div>
</div>
