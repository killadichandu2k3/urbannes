<div>
  <div class="page-intro">
    <h1>Community Chat Lobby</h1>
    <p class="muted">Connect with attendees in real-time. Join lobbies or switch rooms below.</p>
  </div>

  <div class="card chat-toolbar">
    <div class="chat-toolbar-room">
      <span class="muted chat-toolbar-label">Room:</span>
      <input
        class="room-input"
        type="text"
        [(ngModel)]="roomIdInput"
        (keyup.enter)="joinRoom()"
        placeholder="Enter room ID..."
      />
      <button class="secondary" (click)="joinRoom()">Join Room</button>
    </div>
    <div class="chat-toolbar-status">
      <span class="badge ok">● {{ participantCount }} Active Online</span>
    </div>
  </div>

  <div class="card chat-panel">
    <div class="chat-log" #logEl>
      <div class="empty-state chat-empty" *ngIf="messages.length === 0">
        <div class="icon">💬</div>
        <p class="muted">No messages in #{{ currentRoom }} yet. Say hello!</p>
      </div>

      <div
        *ngFor="let msg of messages"
        class="chat-bubble"
        [class.mine]="msg.userId === auth.currentUser?.id"
      >
        <div class="who">{{ msg.userId === auth.currentUser?.id ? 'You' : ('User ' + msg.userId.slice(0, 6)) }}</div>
        <div>{{ msg.body }}</div>
      </div>
    </div>

    <div class="chat-compose">
      <input
        class="compose-input"
        type="text"
        [(ngModel)]="draft"
        (keyup.enter)="send()"
        placeholder="Type a message and press Enter..."
      />
      <button (click)="send()" [disabled]="!draft.trim()">Send</button>
    </div>
  </div>
</div>
