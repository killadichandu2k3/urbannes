<div class="auth-page">
  <div class="card auth-card">
    <h1>Sign in</h1>
    <p class="muted">Welcome back to UrbanNest.</p>

    <div *ngIf="error" class="error-banner">{{ error }}</div>

    <form (ngSubmit)="submit()" #form="ngForm">
      <label class="faint" for="login-email">Email</label>
      <input
        id="login-email"
        name="email"
        type="email"
        autocomplete="email"
        [(ngModel)]="email"
        required
        placeholder="you@example.com"
      />

      <label class="faint" for="login-password">Password</label>
      <input
        id="login-password"
        name="password"
        type="password"
        autocomplete="current-password"
        [(ngModel)]="password"
        required
        placeholder="••••••••"
      />

      <button type="submit" [disabled]="submitting">
        {{ submitting ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="muted auth-switch">
      New here? <a routerLink="/auth/register">Create an account</a>
    </p>
  </div>
</div>
