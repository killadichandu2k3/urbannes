<div class="auth-page auth-page--split">
  <div class="auth-visual" aria-hidden="true">
    <div class="auth-visual-copy">
      <h2>Your seat is waiting.</h2>
      <p>Real-time seat maps, instant confirmation, and a front-row view of everything happening near you.</p>
    </div>

  </div>
  <div class="auth-form-side">
  <div class="card auth-card">
    <div style="text-align: center; margin-bottom: var(--sp-5);">
      <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width: 40px; height: 40px; margin: 0 auto var(--sp-3);">
        <path d="M14 2.5c1.4 0 2.6.86 3.1 2.16.34.87 1.2 1.44 2.13 1.34a3.33 3.33 0 0 1 3.67 3.67c-.1.93.47 1.79 1.34 2.13a3.33 3.33 0 0 1 0 6.2c-.87.34-1.44 1.2-1.34 2.13a3.33 3.33 0 0 1-3.67 3.67c-.93-.1-1.79.47-2.13 1.34a3.33 3.33 0 0 1-6.2 0c-.34-.87-1.2-1.44-2.13-1.34a3.33 3.33 0 0 1-3.67-3.67c.1-.93-.47-1.79-1.34-2.13a3.33 3.33 0 0 1 0-6.2c.87-.34 1.44-1.2 1.34-2.13a3.33 3.33 0 0 1 3.67-3.67c.93.1 1.79-.47 2.13-1.34A3.35 3.35 0 0 1 14 2.5Z" fill="var(--accent)"/>
        <path d="M10.5 14.2 12.9 16.6 17.5 11" stroke="var(--on-accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h2>Welcome Back</h2>
      <p class="muted">Sign in to your UrbanNes account to access tickets and seat reservations.</p>
    </div>

    <div *ngIf="error" class="error-banner flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
      <span>{{ error }}</span>
    </div>

    <div class="flex justify-center mb-4" #googleBtn></div>
    <div class="flex items-center gap-3 my-5" aria-hidden="true">
      <span class="flex-1 border-t border-app-border"></span>
      <span class="text-xs text-app-faint">OR</span>
      <span class="flex-1 border-t border-app-border"></span>
    </div>

    <form (ngSubmit)="submit()" #form="ngForm">
      <div>
        <label class="muted" style="font-weight: 600; margin-bottom: 6px; display: block;" for="login-email">Email Address</label>
        <input
          id="login-email"
          name="email"
          type="email"
          autocomplete="email"
          [(ngModel)]="email"
          required
          placeholder="name@example.com"
        />
      </div>

      <div style="margin-top: var(--sp-3);">
        <label class="muted" style="font-weight: 600; margin-bottom: 6px; display: block;" for="login-password">Password</label>
        <input
          id="login-password"
          name="password"
          type="password"
          autocomplete="current-password"
          [(ngModel)]="password"
          required
          placeholder="••••••••"
        />
      </div>

      <button type="submit" style="margin-top: var(--sp-4); width: 100%; padding: 12px;" [disabled]="submitting">
        {{ submitting ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="muted auth-switch" style="margin-top: var(--sp-5); text-align: center;">
      New to UrbanNes? <a routerLink="/auth/register" style="font-weight: 600;">Create an account</a>
    </p>
  </div>
  </div>
</div>
